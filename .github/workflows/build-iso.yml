name: Build AI-OS Live ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Gerekli Paketleri Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common

      - name: ISO Derleme Betiğini Çalıştır
        run: |
          chmod +x scripts/build/build_full_os.sh scripts/build/build_iso.sh
          sudo bash scripts/build/build_full_os.sh

      - name: OTA Sürüm Manifestini Güncelle
        run: |
          python3 src/updater/manifest_generator.py

      - name: ISO İmajını GitHub Release / Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: aios-live-iso
          path: |
            /tmp/aios-build/*.iso
            website/manifest.json
          if-no-files-found: ignore
