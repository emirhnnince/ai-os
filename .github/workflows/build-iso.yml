name: Build AI-OS Live ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Gerekli Paketleri Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common

      - name: ISO Derleme Betiğini Çalıştır
        run: |
          chmod +x scripts/build/build_full_os.sh scripts/build/build_iso.sh
          sudo bash scripts/build/build_full_os.sh

      - name: OTA Sürüm Manifestini Güncelle
        run: |
          python3 -c "from src.updater.manifest_generator import create_release_manifest; create_release_manifest('2.1.0', 'filesystem.squashfs', 'WebGL Fotogerçekçi Plazma Küre, Formant Ses Motoru, Kendi Kendini Geliştiren Hafıza ve Çoklu Kullanıcı Kurulum Sihirbazı.', iso_path='aios-live-v0.1-amd64.iso')"

      - name: ISO İmajını GitHub Release / Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: aios-live-iso
          path: |
            *.iso
            filesystem.squashfs
            website/manifest.json
          if-no-files-found: ignore
