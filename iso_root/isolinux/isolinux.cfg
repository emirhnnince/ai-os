# ==============================================================================
# AI-OS Syslinux/Isolinux Önyükleyici (Legacy BIOS Sistemleri İçin)
# ==============================================================================

UI vesamenu.c32
PROMPT 0
TIMEOUT 50

MENU TITLE AI-OS Live USB Boot Menu (Legacy BIOS)
MENU BACKGROUND splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std

LABEL aios-persist
    MENU LABEL ^1. AI-OS Live (Kalıcı Çok Kullanıcılı Mod - Önerilen)
    MENU DEFAULT
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components persistence persistence-label=AIOS-DATA quiet splash

LABEL aios-ram
    MENU LABEL ^2. AI-OS Live (Salt RAM Modu - Toram)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live toram components quiet splash

LABEL aios-failsafe
    MENU LABEL ^3. AI-OS Failsafe (Güvenli Grafik)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components noapic noacpi nosplash nomodeset

LABEL reboot
    MENU LABEL ^4. Yeniden Baslat
    COM32 reboot.c32
