# ==============================================================================
# AI-OS GRUB2 Önyükleyici Yapılandırması (UEFI & BIOS Destekli)
# ==============================================================================

set default=0
set timeout=5
set timeout_style=menu

# Renk Ayarları (Karanlık Siber Tema)
set color_normal=cyan/black
set color_highlight=black/light-cyan

insmod all_video
insmod font
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

# 1. Varsayılan Seçenek: Kalıcı Çok Kullanıcılı Yapay Zeka İşletim Sistemi
menuentry "🚀 AI-OS 0.1 Live (Kalıcı Veri & Çok Kullanıcılı Mod - Önerilen)" --class debian --class gnu-linux --class gnu --class os {
    echo "Linux Çekirdeği yükleniyor..."
    linux /live/vmlinuz boot=live components persistence persistence-label=AIOS-DATA quiet splash loglevel=3 rd.systemd.show_status=auto systemd.unit=graphical.target
    echo "Sistem RAM İmajı (Initrd) yükleniyor..."
    initrd /live/initrd.img
}

# 2. Seçenek: Salt RAM Modu (Bellekten Çalışır, USB'ye Hiçbir Şey Kaydetmez)
menuentry "⚡ AI-OS 0.1 Live (Salt RAM Modu - İz Bırakmaz / Toram)" --class debian --class os {
    echo "AI-OS tamamen sistem belleğine (RAM) kopyalanıyor..."
    linux /live/vmlinuz boot=live toram components quiet splash
    initrd /live/initrd.img
}

# 3. Güvenli Grafik Modu (Eski veya Uyumsuz Ekran Kartları İçin)
menuentry "🛡️ AI-OS 0.1 (Failsafe - Güvenli Grafik & Nomodeset)" --class debian --class os {
    linux /live/vmlinuz boot=live components noapic noacpi nosplash nomodeset xforcevesa
    initrd /live/initrd.img
}

# 4. Bilgisayarın Kendi Sabit Diskine Dön (Windows / Mevcut OS)
menuentry "💻 Bilgisayarın Kendi Diskini Başlat (Mevcut İşletim Sistemi)" {
    exit
}

# 5. Sistemi Yeniden Başlat / Kapat
menuentry "🔄 Sistemi Yeniden Başlat" {
    reboot
}
menuentry "🛑 Bilgisayarı Kapat" {
    halt
}
